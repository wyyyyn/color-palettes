<!DOCTYPE html>
<html lang="zh-CN" data-ui-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计实验室 — 五维组合预览</title>
<!-- Bundled OFL fonts (self-hosted, works offline). See assets/fonts/OFL.txt -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<!-- Fallback: Google Fonts CDN (used only if the bundled assets are absent) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces&family=Inter&family=Playfair+Display&family=Source+Serif+4&family=Newsreader&family=Spectral&family=Space+Grotesk&family=Cormorant+Garamond&family=EB+Garamond&family=Libre+Baskerville&family=Crimson+Pro&family=Lora&family=Bitter&family=DM+Serif+Display&family=DM+Sans&family=Instrument+Serif&family=Abril+Fatface&family=Work+Sans&family=Zilla+Slab&family=Manrope&family=Plus+Jakarta+Sans&family=Sora&family=Outfit&family=Archivo&family=Bricolage+Grotesque&family=Hanken+Grotesk&family=IBM+Plex+Mono&family=JetBrains+Mono&family=Space+Mono&family=Noto+Serif+SC&family=Noto+Sans+SC&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ui-bg:#faf9f5; --ui-panel:#fffdf8; --ui-panel2:#f3f1ea; --ui-line:#e8e6dc;
  --ui-tx:#141413; --ui-tx2:#6f6d63; --ui-ac:#d97757; --ui-ac-press:#c15f3c;
  --ui-shadow:0 1px 2px rgba(20,20,19,.04),0 8px 30px rgba(20,20,19,.05);
}
html[data-ui-theme="dark"]{
  --ui-bg:#262624; --ui-panel:#30302e; --ui-panel2:#2b2a28; --ui-line:#3d3b35;
  --ui-tx:#faf9f5; --ui-tx2:#b0aea5; --ui-ac:#e08a6b; --ui-ac-press:#d97757;
  --ui-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 34px rgba(0,0,0,.32);
}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans SC',system-ui,sans-serif;
  background:var(--ui-bg);color:var(--ui-tx);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--ui-line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== APP SHELL ===== */
.app{display:flex;flex-direction:column;height:100vh}
.bar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 20px;background:var(--ui-panel);
  border-bottom:1px solid var(--ui-line);z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap;min-width:0}
#brandT{white-space:nowrap}
.brand .star{color:var(--ui-ac);font-size:15px}
.brand .sub{font-size:11px;color:var(--ui-tx2);font-weight:400;margin-left:4px}
.bar-actions{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 13px;border-radius:7px;
  border:1px solid var(--ui-line);background:var(--ui-panel);
  color:var(--ui-tx);font-size:12px;font-family:inherit;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--ui-tx2)}
.btn.primary{background:var(--ui-ac);border-color:var(--ui-ac);color:#fff}
.btn.primary:hover{background:var(--ui-ac-press);border-color:var(--ui-ac-press)}
.btn .k{font-size:10px;opacity:.6;font-family:'IBM Plex Mono',monospace}
.body{flex:1;display:flex;min-height:0}

/* ===== SIDEBAR ===== */
.side{
  width:328px;flex-shrink:0;overflow-y:auto;
  background:var(--ui-panel);border-right:1px solid var(--ui-line);
  padding:6px 0 60px;
}
.menu{border-bottom:1px solid var(--ui-line)}
.menu-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px 9px;position:sticky;top:0;
  background:var(--ui-panel);z-index:2;
}
.menu-h .t{display:flex;align-items:baseline;gap:8px}
.menu-h .t b{font-size:12.5px;font-weight:600;letter-spacing:1px}
.menu-h .t span{font-size:10px;color:var(--ui-tx2)}
.lock{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--ui-line);
  background:transparent;color:var(--ui-tx2);cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.lock:hover{border-color:var(--ui-tx2)}
.lock.on{background:var(--ui-ac);border-color:var(--ui-ac);color:#fff}
.opts{display:flex;flex-direction:column;gap:5px;padding:2px 12px 16px}
.opts.scroll{max-height:266px;overflow-y:auto;padding-right:8px}
.opt{
  display:flex;align-items:center;gap:11px;
  padding:8px 9px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;background:var(--ui-panel2);
  transition:border-color .14s,transform .14s;
}
.opt:hover{border-color:var(--ui-tx2)}
.opt.sel{border-color:var(--ui-ac);background:color-mix(in srgb,var(--ui-ac) 9%,var(--ui-panel2))}
.opt .thumb{flex-shrink:0;width:54px;height:38px;border-radius:5px;overflow:hidden;border:1px solid var(--ui-line)}
.opt .meta{min-width:0;flex:1}
.opt .meta .n{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .meta .s{font-size:10.5px;color:var(--ui-tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .chk{flex-shrink:0;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ui-line);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.opt.sel .chk{background:var(--ui-ac);border-color:var(--ui-ac);color:#fff}
/* swatch thumb */
.sw{display:flex;height:100%}.sw i{flex:1;display:block}
/* font thumb */
.ft{display:flex;align-items:center;justify-content:center;height:100%;font-size:17px;background:var(--ui-panel)}
/* schematic thumb */
.dg{display:flex;flex-direction:column;justify-content:center;gap:3px;height:100%;padding:7px 8px;background:var(--ui-panel)}
.dg i{display:block;height:3px;border-radius:2px;background:var(--ui-tx2);opacity:.4}

/* ===== STAGE (live preview) ===== */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--ui-bg);padding:34px 40px 80px}
.combo{
  max-width:980px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:6px;
  font-size:11px;color:var(--ui-tx2);
}
.combo .c{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  border:1px solid var(--ui-line);border-radius:20px;background:var(--ui-panel);
}
.combo .c b{color:var(--ui-tx);font-weight:500}
.combo .c em{font-style:normal;opacity:.6;font-size:10px}

.stage{
  --c-bg:#f9f4ef;--c-card:#eaddcf;--c-tx:#020826;--c-tx2:#716040;
  --c-ac:#8c7851;--c-ac2:#f25042;--c-bt:#fff;--c-line:#7160402e;
  --f-display:'Fraunces','Noto Serif SC',Georgia,serif;
  --f-body:'Inter','Noto Sans SC',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --fs1:40px;--fs2:22px;--fsb:16px;--fss:12px;--lh:1.8;--measure:600px;
  --track:0px;--padY:56px;--padX:40px;--gap:14px;--cols:2;--halign:left;--heroPadY:56px;
  --radius:8px;--bw:1px;--shadow:none;--btnr:6px;--btnp:10px 22px;--wD:600;--wB:400;
  --anim:360ms;
  max-width:980px;margin:0 auto;position:relative;overflow:hidden;
  border-radius:14px;background:var(--c-bg);color:var(--c-tx);
  font-family:var(--f-body);box-shadow:var(--ui-shadow);
  transition:background var(--anim) ease,color var(--anim) ease;
}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
.stage[data-tex="paper"]::before{background-image:radial-gradient(var(--c-tx) .6px,transparent .6px);background-size:7px 7px;opacity:.045}
.stage[data-tex="scanline"]::before{background-image:repeating-linear-gradient(0deg,var(--c-tx) 0 1px,transparent 1px 4px);opacity:.05}
.stage[data-tex="vignette"]::before{background:radial-gradient(ellipse at 50% 35%,transparent 52%,rgba(0,0,0,.2))}
.stage[data-tex="none"]::before{display:none}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background-color:var(--c-tx2);-webkit-mask-image:var(--pat,none);mask-image:var(--pat,none);-webkit-mask-repeat:repeat;mask-repeat:repeat;opacity:.07}
.stage[data-pat="none"]::after{display:none}
.st-orn{height:20px;margin:0 var(--padX) calc(var(--padY) * .35);background-color:var(--c-ac);-webkit-mask:var(--orn,none) center/auto 100% no-repeat;mask:var(--orn,none) center/auto 100% no-repeat;opacity:.5}
.stage[data-pat="none"] .st-orn{display:none}
.st-proj-i{width:30px;height:30px;background:var(--c-ac);-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.st-in{position:relative;z-index:1;max-width:calc(var(--measure) + var(--padX)*2);margin:0 auto}
.st-nav{display:flex;justify-content:space-between;align-items:center;padding:22px var(--padX)}
.st-logo{font-family:var(--f-display);font-size:calc(var(--fsb) + 1px);font-weight:var(--wD);letter-spacing:.5px}
.st-links{display:flex;gap:20px;font-size:var(--fss)}
.st-links span{opacity:.6}
.st-hero{padding:var(--heroPadY) var(--padX) calc(var(--heroPadY) * .8);text-align:var(--halign)}
.st-tag{font-family:var(--f-mono);font-size:var(--fss);letter-spacing:2px;opacity:.5;margin-bottom:16px;text-transform:uppercase}
.st-h1{font-family:var(--f-display);font-size:var(--fs1);font-weight:var(--wD);line-height:1.32;letter-spacing:var(--track);margin-bottom:16px}
.st-lede{font-size:var(--fsb);line-height:var(--lh);opacity:.72;max-width:var(--measure);margin-bottom:24px}
.st-hero[style*="center"] .st-lede,.stage[data-halign] .st-hero{margin-left:auto;margin-right:auto}
.st-btns{display:flex;gap:10px;justify-content:var(--halign)}
.st-b1,.st-b2{font-family:var(--f-body);font-size:var(--fss);font-weight:500;padding:var(--btnp);border-radius:var(--btnr);cursor:default;transition:all var(--anim)}
.st-b1{background:var(--c-ac);color:var(--c-bt);border:none}
.st-b2{background:transparent;color:var(--c-ac);border:1.5px solid var(--c-ac)}
.st-sec{padding:calc(var(--padY) * .7) var(--padX)}
.st-sectitle{font-family:var(--f-mono);font-size:var(--fss);letter-spacing:2px;opacity:.5;margin-bottom:20px;padding-bottom:8px;text-transform:uppercase}
.stage[data-rule="1"] .st-sectitle{border-bottom:1px solid var(--c-line)}
.st-art{padding:18px 20px;margin-bottom:var(--gap);background:var(--c-card);border:var(--bw) solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow)}
.st-art-t{font-family:var(--f-display);font-size:var(--fs2);font-weight:var(--wD);margin-bottom:6px}
.st-art-d{font-size:var(--fsb);line-height:var(--lh);opacity:.66;margin-bottom:9px}
.st-art-m{font-family:var(--f-mono);font-size:calc(var(--fss) - 1px);opacity:.45;display:flex;gap:14px;align-items:center}
.st-art-tag{padding:2px 9px;border-radius:calc(var(--radius) * .4);font-size:calc(var(--fss) - 1px);background:var(--c-ac2);color:var(--c-bt);opacity:1}
.st-grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.st-proj{padding:22px;background:var(--c-card);border:var(--bw) solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow)}
.st-proj-i{font-size:22px;margin-bottom:10px;color:var(--c-ac)}
.st-proj-n{font-family:var(--f-display);font-size:var(--fs2);font-weight:var(--wD);margin-bottom:6px}
.st-proj-d{font-size:var(--fss);line-height:var(--lh);opacity:.58}
.st-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:28px var(--padX);font-family:var(--f-mono);font-size:calc(var(--fss) - 1px);opacity:.4;border-top:1px solid var(--c-line)}
.st-link{text-decoration:none;color:inherit}
.stage[data-link="underline"] .st-links span,.stage[data-link="underline"] .st-foot span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
/* motifs */
.stage[data-motif="star"] .st-logo::before{content:"✻ ";color:var(--c-ac)}
.stage[data-motif="star"] .st-sectitle::before{content:"✻  ";color:var(--c-ac)}
.stage[data-motif="prompt"] .st-logo::before{content:"$ ";font-family:var(--f-mono);color:var(--c-ac)}
.stage[data-motif="prompt"] .st-sectitle::before{content:"> ";font-family:var(--f-mono);color:var(--c-ac)}
.stage[data-motif="dot"] .st-sectitle::before{content:"◦  ";color:var(--c-ac)}
.stage[data-motif="rule"] .st-sectitle{border-bottom:1px solid var(--c-line)}

/* ===== ELEMENTS (元件) — recipes from modern OSS component systems ===== */
/* shadcn/ui: 1px low-contrast border, ~8px radius, no shadow, outlined 2nd btn */
.stage[data-el="shadcn"] .st-b1{border-radius:8px}
.stage[data-el="shadcn"] .st-b2{border-radius:8px;border:1px solid var(--c-line);color:var(--c-tx)}
.stage[data-el="shadcn"] .st-art,.stage[data-el="shadcn"] .st-proj{border:1px solid var(--c-line);box-shadow:none;border-radius:10px}
.stage[data-el="shadcn"] .st-art-tag{border-radius:6px}
/* daisyUI soft: tinted translucent fills, no border */
.stage[data-el="soft"] .st-b1{border-radius:8px;border:none}
.stage[data-el="soft"] .st-b2{border-radius:8px;border:none;background:color-mix(in srgb,var(--c-ac) 14%,transparent);color:var(--c-ac)}
.stage[data-el="soft"] .st-art,.stage[data-el="soft"] .st-proj{border:none;border-radius:14px;box-shadow:none}
.stage[data-el="soft"] .st-art-tag{border-radius:999px;background:color-mix(in srgb,var(--c-ac2) 24%,transparent);color:var(--c-tx)}
/* solid: filled, micro shadow, surface 2nd btn */
.stage[data-el="solid"] .st-b1,.stage[data-el="solid"] .st-b2{border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.stage[data-el="solid"] .st-b2{background:var(--c-card);border:1px solid var(--c-line);color:var(--c-tx)}
.stage[data-el="solid"] .st-art,.stage[data-el="solid"] .st-proj{border:1px solid var(--c-line);border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stage[data-el="solid"] .st-art-tag{border-radius:5px}
/* outline: prominent stroked buttons */
.stage[data-el="outline"] .st-b1{background:transparent;color:var(--c-ac);border:1.5px solid var(--c-ac);border-radius:8px}
.stage[data-el="outline"] .st-b2{border-radius:8px;border:1.5px solid var(--c-line);color:var(--c-tx2)}
.stage[data-el="outline"] .st-art,.stage[data-el="outline"] .st-proj{border:1px solid var(--c-line);box-shadow:none;border-radius:8px}
.stage[data-el="outline"] .st-art-tag{border-radius:4px;background:transparent;border:1px solid var(--c-line);color:var(--c-tx2)}
/* pill: fully rounded, hairline cards */
.stage[data-el="pill"] .st-b1,.stage[data-el="pill"] .st-b2{border-radius:999px}
.stage[data-el="pill"] .st-b2{border:1px solid var(--c-line)}
.stage[data-el="pill"] .st-art,.stage[data-el="pill"] .st-proj{border:1px solid var(--c-line);border-radius:16px;box-shadow:none}
.stage[data-el="pill"] .st-art-tag{border-radius:999px}
/* Pico: tiny radius, borderless, layered ultra-soft shadow */
.stage[data-el="pico"] .st-b1,.stage[data-el="pico"] .st-b2{border-radius:4px;border:none}
.stage[data-el="pico"] .st-art,.stage[data-el="pico"] .st-proj{border:none;border-radius:8px;box-shadow:0 .06rem .12rem rgba(99,99,110,.05),0 .22rem .45rem rgba(99,99,110,.05),0 .5rem 1rem rgba(99,99,110,.06)}
.stage[data-el="pico"] .st-art-tag{border-radius:4px}
/* elevated: borderless soft card shadow */
.stage[data-el="elevated"] .st-b1,.stage[data-el="elevated"] .st-b2{border-radius:8px}
.stage[data-el="elevated"] .st-b2{border:1px solid var(--c-line)}
.stage[data-el="elevated"] .st-art,.stage[data-el="elevated"] .st-proj{border:none;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.10)}
.stage[data-el="elevated"] .st-art-tag{border-radius:6px}
/* flat: no border no shadow, ghost 2nd btn */
.stage[data-el="flat"] .st-b1{border-radius:6px}
.stage[data-el="flat"] .st-b2{border:none;background:transparent;color:var(--c-ac);border-radius:6px}
.stage[data-el="flat"] .st-art,.stage[data-el="flat"] .st-proj{border:none;box-shadow:none;border-radius:8px}
.stage[data-el="flat"] .st-art-tag{border-radius:4px;background:color-mix(in srgb,var(--c-ac) 16%,transparent);color:var(--c-tx)}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);
  background:var(--ui-tx);color:var(--ui-bg);font-size:12px;
  padding:9px 18px;border-radius:8px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:100;font-family:'IBM Plex Mono',monospace;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{
  position:fixed;bottom:18px;right:18px;z-index:40;
  background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;
  padding:7px 11px;font-size:10px;color:var(--ui-tx2);line-height:1.6;
}
.hint kbd{font-family:'IBM Plex Mono',monospace;background:var(--ui-panel2);border:1px solid var(--ui-line);border-radius:3px;padding:0 4px;font-size:9px;color:var(--ui-tx)}

/* ===== EXPORT PANEL ===== */
.export{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:90;
  display:none;align-items:center;justify-content:center;padding:32px;
}
.export.show{display:flex}
.export-box{
  width:min(680px,100%);max-height:80vh;display:flex;flex-direction:column;
  background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;overflow:hidden;
}
.export-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--ui-line)}
.export-h b{font-size:13px}
.export pre{
  margin:0;padding:18px 20px;overflow:auto;flex:1;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.7;
  color:var(--ui-tx);background:var(--ui-panel2);white-space:pre;
}
.export-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--ui-line)}
/* snapshots */
.snap-box{width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;overflow:hidden}
.snap-list{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.snap-empty{color:var(--ui-tx2);font-size:12px;text-align:center;padding:28px 0}
.snap{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--ui-line);border-radius:9px;background:var(--ui-panel2)}
.snap .ssw{display:flex;width:50px;height:30px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--ui-line)}
.snap .ssw i{flex:1}
.snap .si{flex:1;min-width:0}
.snap .si .sn{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap .si .sd{font-size:10.5px;color:var(--ui-tx2);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap .sb{display:flex;gap:5px;flex-shrink:0}
.snap .sb button{height:26px;padding:0 9px;font-size:11px;border-radius:6px;border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-tx);cursor:pointer}
.snap .sb button:hover{border-color:var(--ui-tx2)}
.snap .sb .x:hover{border-color:#d9534f;color:#d9534f}
/* compare A/B */
#cmpModal{padding:20px}
.cmp{display:flex;flex-direction:column;width:100%;height:100%;max-width:1500px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;overflow:hidden}
.cmp-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line);flex-shrink:0}
.cmp-top .lab{display:flex;gap:8px;font-size:12px;color:var(--ui-tx2);flex-wrap:wrap}
.cmp-top .lab b{color:var(--ui-tx);font-weight:500}
.cmp-cols{flex:1;display:flex;gap:14px;padding:16px;overflow:hidden;min-height:0}

/* ===== STATE ===== */
let sel={}, locked={};
for(const a of AXES){sel[a.k]=0;locked[a.k]=false}

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('cp_sel')||'null');
    if(s)for(const a of AXES){const arr=a.data;let i=arr.findIndex(o=>o.id===s[a.k]);if(i<0)i=0;sel[a.k]=i}
    const lk=JSON.parse(localStorage.getItem('cp_locked')||'null');if(lk)locked=Object.assign(locked,lk);
    const lg=localStorage.getItem('cp_lang');if(lg)lang=lg;
    const th=localStorage.getItem('cp_uitheme');if(th)document.documentElement.setAttribute('data-ui-theme',th);
  }catch(e){}
}
function saveState(){
  const s={};for(const a of AXES)s[a.k]=a.data[sel[a.k]].id;
  localStorage.setItem('cp_sel',JSON.stringify(s));
  localStorage.setItem('cp_locked',JSON.stringify(locked));
  localStorage.setItem('cp_lang',lang);
  localStorage.setItem('cp_uitheme',document.documentElement.getAttribute('data-ui-theme'));
}

/* ===== SHAREABLE URL ===== */
function comboStr(s){return AXES.map(a=>a.data[s[a.k]].id).join('~')}
function parseCombo(str){
  if(!str)return null;
  const p=String(str).split('~');if(p.length!==AXES.length)return null;
  const r={};
  for(let i=0;i<AXES.length;i++){const j=AXES[i].data.findIndex(o=>o.id===p[i]);if(j<0)return null;r[AXES[i].k]=j}
  return r;
}
function syncHash(){try{history.replaceState(null,'','#'+comboStr(sel))}catch(e){}}

/* ===== SNAPSHOTS ===== */
let snaps=[];
function loadSnaps(){try{snaps=JSON.parse(localStorage.getItem('cp_snaps')||'[]')||[]}catch(e){snaps=[]}}
function persistSnaps(){localStorage.setItem('cp_snaps',JSON.stringify(snaps))}
function comboLabel(s){return T[s.palette].id+' · '+on(T[s.palette])+' / '+on(FONTS[s.font])+' / '+on(LAYOUTS[s.layout])+' / '+on(TONES[s.tone])+' / '+on(MOODS[s.mood])}
function swStrip(s){const p=T[s.palette];return [p.bg,p.c.startsWith('rgba')?p.bg:p.c,p.ac,p.ac2,p.tx].map(c=>`<i style="background:${c}"></i>`).join('')}

function t(k){return L[lang][k]}
function on(o){return lang==='zh'?o.n:(o.nEn||o.n)}
function os(o){return lang==='zh'?o.s:(o.sEn||o.s)}

/* ===== THUMBNAILS ===== */
function thumb(axis,o){
  if(axis==='palette')
    return `<div class="sw"><i style="background:${o.bg}"></i><i style="background:${o.c.startsWith('rgba')?o.bg:o.c}"></i><i style="background:${o.ac}"></i><i style="background:${o.ac2}"></i><i style="background:${o.tx}"></i></div>`;
  if(axis==='font')
    return `<div class="ft" style="font-family:${o.d}">Ag留</div>`;
  if(axis==='layout'){
    const v=o.v,w1=Math.min(46,v.measure/18),lhh=Math.max(2,7-v.lh*2);
    return `<div class="dg"><i style="width:${Math.min(46,v.fs1)}px;height:${Math.max(4,v.fs1/9)}px;opacity:.6"></i><i style="width:${w1}px;margin-bottom:${lhh}px"></i><i style="width:${w1-6}px"></i></div>`;
  }
  if(axis==='tone'){
    const v=o.v;
    return `<div class="dg" style="align-items:flex-start;justify-content:center"><i style="width:30px;height:13px;background:var(--ui-ac);opacity:1;border-radius:${Math.min(13,v.btnr)}px;box-shadow:${v.shadow==='none'?'none':'2px 2px 0 var(--ui-line)'}"></i><i style="width:40px;height:9px;border:${v.bw}px solid var(--ui-tx2);background:transparent;opacity:.5;border-radius:${Math.min(9,v.radius)}px"></i></div>`;
  }
  if(axis==='icons'){
    const m=c=>`<span style="width:19px;height:19px;background:var(--ui-tx);-webkit-mask:url(assets/icons/styles/${o.id}/${c}.svg) center/contain no-repeat;mask:url(assets/icons/styles/${o.id}/${c}.svg) center/contain no-repeat"></span>`;
    return `<div class="ft" style="display:flex;gap:7px">${m('canvas')}${m('book')}</div>`;
  }
  if(axis==='pattern'){
    if(!o.pat)return `<div class="ft" style="color:var(--ui-tx2);font-size:11px">·</div>`;
    return `<div class="ft" style="background-color:var(--ui-tx2);-webkit-mask:url(assets/patterns/${o.pat}) repeat;mask:url(assets/patterns/${o.pat}) repeat;opacity:.55"></div>`;
  }
  if(axis==='elements'){
    const E=({shadcn:{br:'8px',bd:'1px solid var(--ui-line)',sh:'none'},soft:{br:'8px',bd:'none',sh:'none',sf:1},solid:{br:'7px',bd:'1px solid var(--ui-line)',sh:'0 1px 2px rgba(0,0,0,.08)'},outline:{br:'8px',bd:'1px solid var(--ui-line)',sh:'none',ol:1},pill:{br:'999px',bd:'1px solid var(--ui-line)',sh:'none'},pico:{br:'4px',bd:'none',sh:'0 2px 6px rgba(99,99,110,.12)'},elevated:{br:'12px',bd:'none',sh:'0 5px 14px rgba(0,0,0,.14)'},flat:{br:'6px',bd:'none',sh:'none'}})[o.id]||{br:'7px',bd:'none',sh:'none'};
    const btn=E.ol?`width:32px;height:13px;background:transparent;border:1.5px solid var(--ui-ac);border-radius:${E.br}`:E.sf?`width:32px;height:13px;background:color-mix(in srgb,var(--ui-ac) 22%,transparent);border-radius:${E.br}`:`width:32px;height:13px;background:var(--ui-ac);border-radius:${E.br};box-shadow:${E.sh}`;
    return `<div class="ft" style="flex-direction:column;gap:5px"><span style="${btn}"></span><span style="width:42px;height:11px;border:${E.bd};border-radius:${E.br==='999px'?'8px':E.br};box-shadow:${E.sh};background:transparent"></span></div>`;
  }
  // mood
  const bgmap={paper:'radial-gradient(currentColor .6px,transparent .6px)',scanline:'repeating-linear-gradient(0deg,currentColor 0 1px,transparent 1px 4px)',vignette:'radial-gradient(ellipse,transparent 40%,rgba(0,0,0,.4))',none:'none'};
  const mk={star:'✻',prompt:'$_',dot:'◦',rule:'—',none:''};
  return `<div class="ft" style="background:var(--ui-panel2);position:relative;color:var(--ui-tx2)"><span style="position:absolute;inset:0;background-image:${bgmap[o.tex]};background-size:6px 6px;opacity:.5"></span><span style="position:relative;font-size:14px;color:var(--ui-ac)">${mk[o.motif]}</span></div>`;
}

/* ===== BUILD MENUS ===== */
function buildMenus(){
  const side=document.getElementById('side');
  side.innerHTML='';
  for(const a of AXES){
    const m=document.createElement('div');m.className='menu';
    const big=a.data.length>9;
    m.innerHTML=`
      <div class="menu-h">
        <div class="t"><b>${t('axis')[a.k]}</b><span>${t('axisEn')[a.k]} · ${a.data.length}</span></div>
        <button class="lock${locked[a.k]?' on':''}" data-axis="${a.k}" title="lock">${locked[a.k]?'🔒':'🔓'}</button>
      </div>
      <div class="opts${big?' scroll':''}" data-list="${a.k}"></div>`;
    side.appendChild(m);
    const list=m.querySelector('[data-list]');
    a.data.forEach((o,i)=>{
      const el=document.createElement('div');
      el.className='opt'+(sel[a.k]===i?' sel':'');
      el.dataset.axis=a.k;el.dataset.i=i;
      el.innerHTML=`<div class="thumb">${thumb(a.k,o)}</div>
        <div class="meta"><div class="n">${a.k==='palette'?o.id+' · ':''}${on(o)}</div><div class="s">${os(o)}</div></div>
        <div class="chk">✓</div>`;
      el.onclick=()=>selectOpt(a.k,i);
      list.appendChild(el);
    });
    m.querySelector('.lock').onclick=()=>toggleLock(a.k);
  }
}

function selectOpt(axis,i){
  sel[axis]=i;
  document.querySelectorAll(`.opt[data-axis="${axis}"]`).forEach(el=>{
    el.classList.toggle('sel',+el.dataset.i===i);
  });
  const list=document.querySelector(`.opts[data-list="${axis}"]`);
  const cur=list&&list.querySelector('.opt.sel');
  if(cur&&list.classList.contains('scroll'))cur.scrollIntoView({block:'nearest'});
  applyCombo();saveState();
}
function toggleLock(axis){
  locked[axis]=!locked[axis];
  const b=document.querySelector(`.lock[data-axis="${axis}"]`);
  b.classList.toggle('on',locked[axis]);b.textContent=locked[axis]?'🔒':'🔓';
  saveState();
}

/* ===== APPLY COMBO ===== */
function applyComboTo(st,s){
  const pal=T[s.palette],fo=FONTS[s.font],la=LAYOUTS[s.layout].v,
        to=TONES[s.tone],mo=MOODS[s.mood];
  const S=(k,v)=>st.style.setProperty(k,v);
  // colors
  S('--c-bg',pal.bg);S('--c-card',pal.c);S('--c-tx',pal.tx);S('--c-tx2',pal.tx2);
  S('--c-ac',pal.ac);S('--c-ac2',pal.ac2);S('--c-bt',pal.bt);
  S('--c-line',(pal.tx2.startsWith('#')?pal.tx2:'#808080')+'2e');
  // fonts
  S('--f-display',fo.d);S('--f-body',fo.b);S('--f-mono',fo.m);
  // layout × mood density
  const d=mo.density;
  S('--fs1',la.fs1+'px');S('--fs2',la.fs2+'px');S('--fsb',la.fsb+'px');S('--fss',la.fss+'px');
  S('--lh',la.lh);S('--measure',la.measure+'px');S('--track',la.track+'px');
  S('--padY',Math.round(la.padY*d)+'px');S('--padX',Math.round(la.padX*d)+'px');
  S('--gap',Math.round(la.gap*d)+'px');S('--cols',la.cols);S('--halign',la.halign);
  S('--heroPadY',Math.round(la.heroPadY*d)+'px');
  // tone
  S('--radius',to.v.radius+'px');S('--bw',to.v.bw+'px');S('--shadow',to.v.shadow);
  S('--btnr',to.v.btnr+'px');S('--btnp',to.v.btnp);S('--wD',to.v.wD);S('--wB',to.v.wB);
  // mood
  S('--anim',mo.anim+'ms');
  st.setAttribute('data-tex',mo.tex);
  st.setAttribute('data-motif',mo.motif);
  st.setAttribute('data-rule',(mo.rule||(to.id==='editorial'?1:0))?'1':'0');
  st.setAttribute('data-link',to.link);
  st.setAttribute('data-halign',la.halign);
  // icons — same 4 concepts, switch visual STYLE only (CSS-masked, accent-tinted)
  const ico=ICONS[s.icons];
  st.querySelectorAll('.st-proj').forEach((pj,k)=>{
    const box=pj.querySelector('.st-proj-i');
    if(box&&ICON_CONCEPTS[k]){box.textContent='';box.style.setProperty('--ic',`url(assets/icons/styles/${ico.id}/${ICON_CONCEPTS[k]}.svg)`);}
  });
  // pattern (花纹) + ornament
  const pt=PATTERNS[s.pattern];
  S('--pat',pt.pat?`url(assets/patterns/${pt.pat})`:'none');
  S('--orn',pt.orn?`url(assets/patterns/${pt.orn})`:'none');
  st.setAttribute('data-pat',pt.pat?pt.id:'none');
  st.setAttribute('data-el',ELEMENTS[s.elements].id);
  fillTextIn(st);
}
function applyCombo(){
  applyComboTo(document.getElementById('stage'),sel);
  renderCombo();syncHash();
}

function fillTextIn(st){
  const q=s=>st.querySelector(s);
  if(!q('.st-logo'))return;
  q('.st-logo').textContent=t('logo');
  q('.st-links').innerHTML=t('nav').map(n=>`<span>${n}</span>`).join('');
  q('.st-tag').textContent=t('tag');
  q('.st-h1').textContent=t('hero');
  q('.st-lede').textContent=t('sub');
  q('.st-b1').textContent=t('btn1');q('.st-b2').textContent=t('btn2');
  q('.s1').textContent=t('sec1');q('.s2').textContent=t('sec2');
  const A=[['a1','a1t','a1d','a1m'],['a2','a2t','a2d','a2m'],['a3','a3t','a3d','a3m']];
  A.forEach((x,idx)=>{
    const r=q('.'+x[0]);if(!r)return;
    r.querySelector('.st-art-t').textContent=t(x[1]);
    r.querySelector('.st-art-d').textContent=t(x[2]);
    r.querySelector('.m-d').textContent=t('months')[idx];
    r.querySelector('.m-c').textContent=t(x[3]);
  });
  const tg=q('.a1 .st-art-tag');if(tg)tg.textContent=t('badge');
  [['p1','p1n','p1d'],['p2','p2n','p2d'],['p3','p3n','p3d'],['p4','p4n','p4d']].forEach(x=>{
    const r=q('.'+x[0]);if(!r)return;
    r.querySelector('.st-proj-n').textContent=t(x[1]);
    r.querySelector('.st-proj-d').textContent=t(x[2]);
  });
  q('.f1').textContent=t('f1');q('.f2').textContent=t('f2');q('.f3').textContent=t('f3');
}

function renderCombo(){
  const cb=document.getElementById('comboBar');
  const items=AXES.map(a=>{
    const o=a.data[sel[a.k]];
    return [a.k,(a.k==='palette'?o.id+' · ':'')+on(o)];
  });
  cb.innerHTML=items.map(([k,v])=>`<span class="c"><em>${t('axis')[k]}</em><b>${v}</b></span>`).join('');
}

/* ===== UI strings ===== */
function applyUIStrings(){
  document.getElementById('brandT').textContent=t('brandT');
  document.getElementById('brandS').textContent=t('brandS');
  document.getElementById('lRand').textContent=t('rand');
  document.getElementById('lSnap').textContent=t('snap');
  document.getElementById('lShare').textContent=t('share');
  document.getElementById('lExport').textContent=t('export');
  document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中文';
  document.getElementById('hRand').textContent=t('hRand');
  document.getElementById('hPal').textContent=t('hPal');
  document.getElementById('hLock').textContent=t('hLock');
  document.getElementById('exTitle').textContent=t('exTitle');
  document.getElementById('exCopy').textContent=t('exCopy');
  document.getElementById('exDone').textContent=t('exDone');
  document.getElementById('snTitle').textContent=t('snTitle');
  document.getElementById('snSave').textContent=t('snSave');
  document.getElementById('snDone').textContent=t('snDone');
  document.getElementById('cmpClose').textContent=t('cmpClose');
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
}

function toggleLang(){lang=lang==='zh'?'en':'zh';applyUIStrings();buildMenus();applyCombo();saveState()}
function toggleUITheme(){
  const h=document.documentElement,n=h.getAttribute('data-ui-theme')==='dark'?'light':'dark';
  h.setAttribute('data-ui-theme',n);saveState();
}

/* ===== RANDOMIZE (unlocked axes) ===== */
function randomize(){
  for(const a of AXES){
    if(locked[a.k])continue;
    let i,n=a.data.length;if(n<2){sel[a.k]=0;continue}
    do{i=Math.floor(Math.random()*n)}while(i===sel[a.k]);
    sel[a.k]=i;
  }
  buildMenus();applyCombo();saveState();
}

/* ===== EXPORT ===== */
function exportText(){
  const pal=T[sel.palette],fo=FONTS[sel.font],la=LAYOUTS[sel.layout].v,
        to=TONES[sel.tone],mo=MOODS[sel.mood],d=mo.density;
  const ico=ICONS[sel.icons], pt=PATTERNS[sel.pattern];
  const head=`/* color-palettes · ${pal.id} ${pal.n} / ${fo.nEn} / ${LAYOUTS[sel.layout].nEn} / ${TONES[sel.tone].nEn} / ${MOODS[sel.mood].nEn} / icons:${ico.nEn} / pattern:${PATTERNS[sel.pattern].nEn} */`;
  const css=`:root{
  --color-bg:${pal.bg};
  --color-card:${pal.c};
  --color-text:${pal.tx};
  --color-text2:${pal.tx2};
  --color-accent:${pal.ac};
  --color-accent2:${pal.ac2};
  --color-btn-text:${pal.bt};
  --font-display:${fo.d};
  --font-body:${fo.b};
  --font-mono:${fo.m};
  --fs-h1:${la.fs1}px; --fs-h2:${la.fs2}px; --fs-body:${la.fsb}px; --fs-small:${la.fss}px;
  --line-height:${la.lh}; --measure:${la.measure}px; --tracking:${la.track}px;
  --space-section:${Math.round(la.padY*d)}px; --space-inline:${Math.round(la.padX*d)}px; --gap:${Math.round(la.gap*d)}px;
  --radius:${to.v.radius}px; --border-width:${to.v.bw}px; --shadow:${to.v.shadow};
  --btn-radius:${to.v.btnr}px; --btn-padding:${to.v.btnp};
  --weight-display:${to.v.wD}; --weight-body:${to.v.wB};
  --transition:${mo.anim}ms;
  /* icons: style "${ico.id}" (assets/icons/styles/${ico.id}/{folio,calendar,book,canvas}.svg) */
  /* pattern (assets/patterns): ${pt.pat||'none'}  ·  ornament: ${pt.orn||'none'} */
}`;
  const fontsLink=`<!-- Bundled offline fonts: copy assets/fonts/ then link it -->\n<link rel="stylesheet" href="assets/fonts/fonts.css">`;
  const json='/* config */\n'+JSON.stringify({palette:pal.id,font:fo.id,layout:LAYOUTS[sel.layout].id,tone:to.id,mood:mo.id,icons:ico.id,pattern:pt.id},null,2);
  return head+'\n'+css+'\n\n'+fontsLink+'\n\n'+json;
}
function openExport(){document.getElementById('exportText').textContent=exportText();document.getElementById('exportModal').classList.add('show')}
function closeExport(){document.getElementById('exportModal').classList.remove('show')}
function copyExport(){copyTxt(exportText());}
function copyShare(){syncHash();copyTxt(location.href,t('shareCopied'));}
function copyTxt(txt,msg){
  const done=()=>{toast(msg||t('copied'))};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb())}
  else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}
let toastTm;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTm);toastTm=setTimeout(()=>el.classList.remove('show'),1900);
}

/* ===== SNAPSHOTS UI ===== */
function openSnaps(){renderSnaps();document.getElementById('snapModal').classList.add('show')}
function closeSnaps(){document.getElementById('snapModal').classList.remove('show')}
function saveSnap(){
  const cs=comboStr(sel);
  if(snaps.includes(cs)){toast(t('snapDup'));openSnaps();return}
  snaps.unshift(cs);if(snaps.length>8)snaps=snaps.slice(0,8);
  persistSnaps();renderSnaps();toast(t('snapSaved'));
  document.getElementById('snapModal').classList.add('show');
}
function delSnap(i){snaps.splice(i,1);persistSnaps();renderSnaps()}
function applySnap(i){const s=parseCombo(snaps[i]);if(!s)return;sel=s;buildMenus();applyCombo();saveState();closeSnaps()}
function renderSnaps(){
  const el=document.getElementById('snapList');
  if(!snaps.length){el.innerHTML=`<div class="snap-empty">${t('snEmpty')}</div>`;return}
  el.innerHTML=snaps.map((cs,i)=>{
    const s=parseCombo(cs);if(!s)return '';
    return `<div class="snap">
      <div class="ssw">${swStrip(s)}</div>
      <div class="si"><div class="sn">${comboLabel(s)}</div><div class="sd">${cs}</div></div>
      <div class="sb">
        <button onclick="applySnap(${i})">${t('snApply')}</button>
        <button onclick="openCmp(${i})">${t('snCmp')}</button>
        <button class="x" onclick="delSnap(${i})" title="delete">✕</button>
      </div></div>`;
  }).join('');
}

/* ===== A/B COMPARE ===== */
function openCmp(i){
  const sA=Object.assign({},sel), sB=parseCombo(snaps[i]); if(!sB)return;
  const tpl=document.getElementById('stage').querySelector('.st-in').outerHTML;
  const mk=(host,s)=>{
    host.innerHTML='';
    const st=document.createElement('div');st.className='stage';st.innerHTML=tpl;
    host.appendChild(st);applyComboTo(st,s);
  };
  mk(document.getElementById('cmpA'),sA);
  mk(document.getElementById('cmpB'),sB);
  document.getElementById('capA').innerHTML='<b>A</b> · '+comboLabel(sA);
  document.getElementById('capB').innerHTML='<b>B</b> · '+comboLabel(sB);
  document.getElementById('cmpTitle').textContent=t('cmpTitle');
  document.getElementById('snapModal').classList.remove('show');
  document.getElementById('cmpModal').classList.add('show');
}
function closeCmp(){document.getElementById('cmpModal').classList.remove('show')}

/* ===== KEYBOARD ===== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key===' '){e.preventDefault();randomize()}
  else if(e.key==='ArrowRight'){e.preventDefault();selectOpt('palette',(sel.palette+1)%T.length)}
  else if(e.key==='ArrowLeft'){e.preventDefault();selectOpt('palette',(sel.palette-1+T.length)%T.length)}
  else if(e.key==='l'||e.key==='L'){toggleLock('palette')}
  else if(e.key==='s'||e.key==='S'){saveSnap()}
  else if(e.key==='t'&&e.altKey){toggleUITheme()}
  else if(e.key==='Escape'){closeCmp();closeSnaps();closeExport()}
});

/* ===== INIT ===== */
loadState();
loadSnaps();
const hsel=parseCombo(location.hash.replace(/^#/,''));
if(hsel)sel=hsel;
applyUIStrings();
buildMenus();
applyCombo();
window.addEventListener('hashchange',()=>{
  const h=parseCombo(location.hash.replace(/^#/,''));
  if(h&&comboStr(h)!==comboStr(sel)){sel=h;buildMenus();applyCombo();saveState()}
});
</script>
